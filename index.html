<!DOCTYPE html> <htm
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Successful - Creator Choice Awards 2026</title>
  <style>
    :root {
      --primary-color: #00c853;
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --text-color: #ffffff;
      --subtext-color: #a0a5b5;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .vote-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .success-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 200, 83, 0.15);
      color: var(--primary-color);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 4px 20px rgba(0, 200, 83, 0.2);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ffffff;
    }
    .subtitle {
      color: var(--subtext-color);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .highlight-name {
      color: #ff3b6c;
      font-weight: 700;
    }
    .footer-note {
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="vote-card">
    <div class="success-icon">✓</div>
    <h1>Vote Successfully Cast!</h1>
    <p class="subtitle">
      Thank you for verifying your session. Your official vote for <span class="highlight-name">Helen</span> has been successfully recorded for the Creator Choice Awards 2026.
    </p>
    <div class="footer-note">
      You can now close this window and return back.
    </div>
  </div>
</body>
</html>
